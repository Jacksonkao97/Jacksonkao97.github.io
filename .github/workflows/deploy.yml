name: Build and Deploy

# Every push runs the checks, builds and prerenders the site and builds the
# resume PDF (attached to the run as the "resume-pdf" artifact). Only pushes
# to main deploy.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-progress Pages deployment; superseded branch runs can go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check .

      # Uses the Google Chrome preinstalled on GitHub's Ubuntu runners
      - name: Generate resume PDF
        run: npm run resume:pdf

      - name: Build
        run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}

      # Renders each page to static HTML and writes sitemap.xml (also Chrome)
      - name: Prerender pages
        run: npm run prerender

      - name: Upload resume PDF
        uses: actions/upload-artifact@v7
        with:
          name: resume-pdf
          path: public/docs/Resume.pdf
          if-no-files-found: error

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
